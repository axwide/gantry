# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit is advisory here: its check isn't required by the `main` ruleset,
# and it can't approve or merge. A human still reviews every PR.
tone_instructions: "Be direct and brief. Lead with the problem, then the fix. Skip praise and filler."

reviews:
  profile: "chill"
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    # CI doesn't run on drafts either; mark the PR ready when you want both.
    drafts: false
    # Grouped lockfile and action-SHA bumps aren't worth an AI review.
    ignore_usernames: ["dependabot[bot]"]

  path_filters:
    - "!uv.lock"
    # syrupy snapshots: review the template that changed, not its output.
    - "!**/__snapshots__/**"
    # Generated by `gantry schema` from the data model.
    - "!schema/problem.schema.json"

  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        Follow CONTRIBUTING.md. In particular:
        - Google-style docstrings on every module, class and function.
        - Internal modules are exposed lazily with `lazy.attach` in the
          package `__init__.py`. External packages are loaded with
          `lazy.load("package")` at module level, never `lazy.load("pkg.subpkg")`.
        - Prefer GEMSEO's documented, idiomatic API over custom code.
    - path: "src/**/templates/**"
      instructions: |
        These Jinja templates generate code that users run and edit. Check
        that the output is valid, idiomatic GEMSEO and Python, and that values
        from the problem-definition TOML can't break out of the identifier or
        string they're rendered into.
    - path: "tests/**"
      instructions: |
        Snapshot tests use syrupy. If a template changed, expect a matching
        snapshot update in the same PR.
    - path: ".github/workflows/**"
      instructions: |
        Actions must be pinned to a full commit SHA with a version comment
        (the repo enforces this). Keep `permissions` at least privilege: read
        by default, write scopes only on the job that needs them.

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: |
        Must follow Conventional Commits, like the commit messages, e.g.
        `feat: support vector objectives` or `fix(cli): handle missing lib dir`.
        A squash merge uses the title as the commit message.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
