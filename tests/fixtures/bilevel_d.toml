[disciplines.sa]
inputs = ["pp", "prof", "mt"]
outputs = ["m", "sc"]

[disciplines.apa]
inputs = ["pp", "mt", "prof"]
outputs = ["l", "d"]

[disciplines.ap]
inputs = ["l", "d", "m"]
outputs = ["obj"]

[disciplines.o]
inputs = ["pp"]
outputs = ["oc"]

[scenarios.scenarios]
design_variables = ["mt"]
disciplines = ["sa", "ap"]
scenario_type = "MDO"

[scenarios.scenarios.objective]
variable = "obj"

[[scenarios.scenarios.constraints]]
variable = "sc"
operator = "<"
value = 0.0

[scenarios.scenarioa]
design_variables = ["prof"]
disciplines = ["apa", "ap"]
scenario_type = "MDO"

[scenarios.scenarioa.objective]
variable = "obj"

[scenarios.scenariosystem]
design_variables = ["pp"]
disciplines = ["scenarioa", "scenarios", "o", "ap"]
scenario_type = "MDO"

[scenarios.scenariosystem.objective]
variable = "obj"

[[scenarios.scenariosystem.constraints]]
variable = "oc"
operator = "<"
value = 0.0

[[scenarios.scenariosystem.constraints]]
variable = "sc"
operator = "<"
value = 0.0

