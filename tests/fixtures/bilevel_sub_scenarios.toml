[disciplines.d_1]
inputs = ["x"]
outputs = ["y"]

[disciplines.d_2]
inputs = ["y"]
outputs = ["z"]

[disciplines.d_3]
inputs = ["z"]
outputs = ["w"]

[scenarios.scenarioa]
design_variables = ["x"]
disciplines = ["d_1"]
scenario_type = "MDO"

[scenarios.scenarioa.objective]
variable = "y"

[scenarios.scenariob]
design_variables = ["z"]
disciplines = ["d_3"]
scenario_type = "MDO"

[scenarios.scenariob.objective]
variable = "w"

[scenarios.scenariosystem]
design_variables = ["x"]
disciplines = ["scenarioa", "scenariob"]
scenario_type = "MDO"

[scenarios.scenariosystem.objective]
variable = "w"

[[variables]]
name = "x"
unit = ""
data_type = "float"
dimension = 1
default_value = 1.0

