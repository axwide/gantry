default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run --no-sync ruff check --extend-select I --fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --no-sync ruff format"
types = ["python"]

[[repos.hooks]]
id = "basedpyright"
name = "basedpyright"
language = "system"
entry = "uv run --no-sync basedpyright src/"
pass_filenames = false
files = "\\.py$"

[[repos.hooks]]
id = "unit-tests"
name = "unit tests"
language = "system"
entry = "uv run --no-sync pytest tests/unit/ -q --tb=short --no-cov"
pass_filenames = false
files = "\\.py$"

# Fail when uv.lock doesn't match pyproject.toml (e.g. a hand-edited dependency).
[[repos.hooks]]
id = "uv-lock-check"
name = "uv lock --check"
language = "system"
entry = "uv lock --check"
pass_filenames = false
files = "^(pyproject\\.toml|uv\\.lock)$"

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = []
