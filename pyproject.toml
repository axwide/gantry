[project]
name = "gemseo-gantry"
version = "0.1.0"
description = "Generate GEMSEO glue code for MDAO problems from a TOML problem definition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Axel Widenfelt" }]
requires-python = ">=3.11"
keywords = ["gemseo", "mdao", "mdo", "optimization", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jinja2>=3.1.6",
    "lazy-loader>=0.4",
    "pandas>=2.3.2",
    "pydantic>=2.11.9",
    "python-slugify>=8.0.4",
    "black>=25.1.0",
    "isort>=6.0.1",
    "gemseo[all]>=6.3.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "watchfiles>=0.21",
    "readchar>=4.2.2",
]

[project.urls]
Homepage = "https://github.com/axwide/gantry"
Documentation = "https://github.com/axwide/gantry/tree/main/docs"
Issues = "https://github.com/axwide/gantry/issues"

[project.scripts]
gantry = "gemseo_gantry.cli.main:app"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jsonschema>=4.23",
    "prek>=0.4",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.7",
    "debugpy>=1.8.17",
    "basedpyright>=1.20.0",
    "syrupy>=4",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--snapshot-warn-unused", "--import-mode=importlib", "--cov=src/gemseo_gantry", "--cov-fail-under=90"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning:pyDOE3.doe_korobov",
]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (run in full CI but not in quick unit check)",
]

[tool.coverage.run]
source = ["src/gemseo_gantry"]
omit = [
    "src/gemseo_gantry/generator/templates/*",
    "src/gemseo_gantry/examples/*/disciplines/*",
    "src/gemseo_gantry/examples/*/scenarios/*",
    "src/gemseo_gantry/examples/*/postprocess.py",
    "src/gemseo_gantry/examples/*/execute_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint]
# Flag Unicode characters easily confused with ASCII (en dash, minus sign, ...).
extend-select = ["RUF001", "RUF002", "RUF003"]
