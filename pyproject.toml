[project]
name = "gemseo-gantry"
version = "0.1.2"
description = "Generate GEMSEO glue code for MDAO problems from a TOML problem definition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Axel Widenfelt" }]
requires-python = "==3.13.*"
keywords = ["gemseo", "mdao", "mdo", "optimization", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jinja2>=3.1.6",
    "lazy-loader>=0.4",
    "pandas>=2.3.2",
    "pydantic>=2.11.9",
    "python-slugify>=9.1.3",
    "gemseo==7.0.0rc0",
    "typer>=0.16.0",
    "rich>=13.0.0",
    "watchfiles>=0.21",
    "readchar>=4.2.2",
    "ruff>=0.17.4",
]

[project.urls]
Homepage = "https://github.com/axwide/gantry"
Documentation = "https://github.com/axwide/gantry/tree/main/docs"
Issues = "https://github.com/axwide/gantry/issues"

[project.scripts]
gantry = "gemseo_gantry.cli.main:app"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jsonschema>=4.23",
    "prek>=0.4",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "debugpy>=1.8.17",
    "basedpyright>=1.20.0",
    "syrupy>=6.1.1",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--snapshot-warn-unused", "--import-mode=importlib", "--cov=src/gemseo_gantry", "--cov-fail-under=90"]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Except GEMSEO's: a deprecated GEMSEO name still resolves in GEMSEO 7 but is
    # removed in GEMSEO 8. Fail on it in gantry, GEMSEO internals and generated code
    # (imported as `lib`, `disciplines` and `execute_*`). Later filters win.
    "error::DeprecationWarning:gemseo",
    "error::DeprecationWarning:lib",
    "error::DeprecationWarning:disciplines",
    "error::DeprecationWarning:execute_",
]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (run in full CI but not in quick unit check)",
]

[tool.coverage.run]
source = ["src/gemseo_gantry"]
omit = [
    "src/gemseo_gantry/generator/templates/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint]
# Flag Unicode characters easily confused with ASCII (en dash, minus sign, ...).
extend-select = ["RUF001", "RUF002", "RUF003"]
