# Version updates for GitHub Actions only. Security updates are switched on in
# the repo settings and cover uv.lock too; they ignore `cooldown`, so
# vulnerability fixes aren't delayed.
#
# There are no version updates for uv. gantry is installed with
# `uv tool install`, which ignores uv.lock and resolves the newest versions
# that pyproject.toml allows. Lockfile bumps wouldn't change what users get,
# and the weekly upstream workflow already tests those newest versions.
version: 2
updates:
  # Workflows pin actions to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Give a bad release time to get caught and pulled before we adopt it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
