name: PR title

# Squash merges use the PR title as the commit message on main, and
# release-please reads those commits to pick the next version and write the
# changelog. The commit-msg hook only checks local commits, so check the title
# here with the same Conventional Commits types.
on:
  pull_request:
    # `edited` re-checks after a title change; `synchronize` puts the check on
    # each new head commit, so it can be a required check.
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
