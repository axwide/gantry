name: Upstream dependencies

# Early warning for dependency releases, GEMSEO above all. Regular CI tests the
# frozen uv.lock, and Dependabot only moves it monthly, so neither notices
# right away when a new release within our ranges breaks us. This runs against
# the newest stable versions that pyproject.toml allows, which is what a new
# user's `uv tool install` gets.
# It never gates a PR. A red run means "look at this before users hit it".
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Install the wheel exactly as a user would and drive the CLI. This resolves
  # without the dev group and lets uv choose the interpreter from
  # `requires-python`. Then run the generated code the way the README says, in
  # its own project with the newest GEMSEO 7, so a new GEMSEO release that
  # breaks generated code shows up here. While gantry pins an exact GEMSEO
  # release candidate, the install step can't see anything newer, but the
  # generated project's `>=7.0.0rc0` (a prerelease specifier, so uv allows
  # prereleases) picks up later release candidates and 7.0.0 itself.
  tool-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --wheel
      - run: uv tool install dist/*.whl
      - run: uv tool list --show-paths
      - name: Generate the starter project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir starter && cd starter
          gantry init --json | jq -e .success
          gantry validate --json | jq -e .success
          gantry build --json | jq -e .success
          gantry scaffold --runnable --json | jq -e .success
      # Follows "Running the generated code" in the README. The stubs return
      # placeholder outputs, so this checks that generated code runs on GEMSEO,
      # not the numbers.
      - name: Run the generated code
        working-directory: ${{ runner.temp }}/starter
        run: |
          uv init --bare
          uv add "gemseo>=7.0.0rc0,<8"
          uv pip list | grep -i '^gemseo '
          for script in execute_*.py load_*.py; do uv run "$script"; done
