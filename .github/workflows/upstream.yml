name: Upstream dependencies

# Early warning for dependency releases, GEMSEO above all. Regular CI tests the
# frozen uv.lock, so it can't notice when a new release within our ranges
# breaks us. This runs the tests against the newest stable versions that
# pyproject.toml allows.
# It never gates a PR. A red run means "look at this before users hit it".
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"
      # Ignore the pins in uv.lock and resolve fresh from pyproject.toml, as a
      # new user's install would. uv records the result in this checkout's
      # uv.lock (never committed), which keeps tests that shell out to
      # `uv run` on the upgraded versions.
      - run: uv sync --upgrade
      - run: uv pip list
      - run: uv run --no-sync pytest --disable-warnings
