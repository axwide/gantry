name: Upstream dependencies

# Early warning for dependency releases, GEMSEO above all. Regular CI tests the
# frozen uv.lock, and Dependabot only moves it monthly, so neither notices
# right away when a new release within our ranges breaks us. This runs against
# the newest stable versions that pyproject.toml allows, which is what a new
# user's `uv tool install` gets.
# It never gates a PR. A red run means "look at this before users hit it".
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Install the wheel exactly as a user would and drive the CLI. This resolves
  # without the dev group and lets uv choose the interpreter from
  # `requires-python`. Then run the generated examples the
  # way the README says, in their own project with uncapped GEMSEO, so a new
  # GEMSEO release that breaks generated code shows up here.
  tool-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv build --wheel
      - run: uv tool install dist/*.whl
      - run: uv tool list --show-paths
      - name: Smoke-test the CLI
        working-directory: ${{ runner.temp }}
        run: |
          gantry example sellar --json | jq -e .success
          gantry example sobieski --json | jq -e .success
          gantry validate --json sobieski/sobieski.toml | jq -e .success
      # Follows "Running the generated code" in the README. Exit codes only;
      # pytest checks the optimum values.
      - name: Run the generated examples
        working-directory: ${{ runner.temp }}
        run: |
          for example in sellar sobieski; do
            (
              cd "$example"
              uv init --bare
              uv add "gemseo>=6.3"
              uv pip list | grep -i '^gemseo '
              uv run execute_*.py
              uv run postprocess.py
            )
          done
